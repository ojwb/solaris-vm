
name: Test

# Use bash by default on all platforms.
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
  push:



concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true



jobs:
  test:
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    name: Solaris
    steps:
    - uses: actions/checkout@v4
    - name: Check arch
      id: check
      run: |
        echo "run=true" >> $GITHUB_OUTPUT
    - name: Test in Solaris
      if: ${{ steps.check.outputs.run == 'true' }}
      id: test
      uses: vmactions/solaris-vm@fdfba55cf7261fa7fa4902d879c1fe92a643d073
      with:
        prepare: |
          set -e
          pkgutil -y -i socat
        mem: 4096
        release: 11.4-gcc
        nat: |
          "10022": "22"
          "8080": "80"
          "8443": "443"
          udp:"8081": "80"
        run: |
          env
          echo "TEST_ENV=abc" >>${GITHUB_ENV}
          if [ -n "test" ]; then
            echo "false"
          fi
          if [ "test" ]; then
            echo "test"
          fi
          pwd
          ls -lah
          whoami
          env
          psrinfo -vp
          cat /etc/release
          psrinfo -v
          echo "::memstat" | mdb -k
          echo "OK"
    - name: Test NAT
      if: ${{ steps.check.outputs.run == 'true' }}
      run:
        echo "TEST_ENV=$TEST_ENV"
        [ "$TEST_ENV" = "abc" ]
        ssh -vvv -p 10022 -i $HOME/.ssh/host.id_rsa root@localhost "uname -a;whoami;pwd"

    - name: Test custom shell
      if: ${{ steps.check.outputs.run == 'true' }}
      shell: solaris {0}
      run: |
        pwd
        cd $GITHUB_WORKSPACE;
        pwd
          if [ -n "test" ]; then
            echo "false"
          fi
          if [ "test" ]; then
            echo "test"
          fi
          pwd
          ls -lah
          whoami
          env
          psrinfo -vp
          cat /etc/release
          psrinfo -v
          echo "::memstat" | mdb -k
          echo "OK"








